name: Publicar PDF

# Genera los PDF de EDICIONES (generar.py --publicacion):
# - en cada petición de fusión y en main, como artefacto descargable para revisarlos;
# - al subir una etiqueta v* (o a mano, indicando la etiqueta), los adjunta a su release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta de la release (p. ej. v1.0). Se crea si no existe."
        required: true

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Generar PDF
        run: python generar.py --publicacion dist

      - uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: dist/*.pdf

      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.etiqueta || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.pdf
          fail_on_unmatched_files: true
