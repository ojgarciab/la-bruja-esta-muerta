name: Publicar PDF

# Genera los PDF de EDICIONES (generar.py --publicacion):
# - en cada petición de fusión y en master, como artefacto descargable para revisarlos;
# - al subir una etiqueta v* (o a mano, indicando la etiqueta), los adjunta a su release.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta de la release (p. ej. v1.0). Si existe, se generan los PDF desde ella; si no, se crea en el commit elegido."
        required: true

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # A mano, si la etiqueta ya existe, los PDF salen de su commit y no de la rama elegida
      - name: Elegir versión
        id: version
        env:
          ETIQUETA: ${{ inputs.etiqueta }}
        run: |
          if [ -n "$ETIQUETA" ] && git rev-parse -q --verify "refs/tags/$ETIQUETA" >/dev/null; then
            git checkout -q "refs/tags/$ETIQUETA^{commit}"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # La caché de pip se reutiliza mientras no cambie el hash de requirements.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar Playwright
        run: pip install -r requirements.txt

      # El runner ya trae Google Chrome con sus dependencias y generar.py lo usa
      # (channel="chrome"): así se evita descargar Chromium e instalar paquetes con
      # apt, que es lo lento. Solo si faltara Chrome se instala el de Playwright.
      - name: Comprobar navegador
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Generar PDF
        run: python generar.py --publicacion dist

      - uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: dist/*.pdf

  release:
    needs: pdf
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pdf
          path: dist

      - name: Publicar en la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ETIQUETA: ${{ inputs.etiqueta || github.ref_name }}
          COMMIT: ${{ needs.pdf.outputs.commit }}
        run: |
          if gh release view "$ETIQUETA" >/dev/null 2>&1; then
            gh release upload "$ETIQUETA" dist/*.pdf --clobber
          else
            gh release create "$ETIQUETA" dist/*.pdf --target "$COMMIT" --title "$ETIQUETA"
          fi
